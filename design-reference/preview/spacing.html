<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 / 8 / 12 / 16 / 20 / 24 / 32 — Tailwind ladder" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px 20px; background: var(--card); font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 12px; height: 22px; }
  .bar { background: var(--blue-3); border-radius: 3px; height: 14px; }
  .name { width: 56px; font-family: var(--font-heading); font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .px   { width: 56px; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .note { font-family: var(--font-body); font-size: 11px; color: var(--text-secondary); margin-left: 6px; }
</style>
</head>
<body>
  <div class="row"><div class="name">space-1</div><div class="px">4px</div><div class="bar" style="width: 4px;"></div><div class="note">hairline gaps</div></div>
  <div class="row"><div class="name">space-2</div><div class="px">8px</div><div class="bar" style="width: 8px;"></div><div class="note">tight (chip ⟷ icon)</div></div>
  <div class="row"><div class="name">space-3</div><div class="px">12px</div><div class="bar" style="width: 12px;"></div><div class="note">form fields</div></div>
  <div class="row"><div class="name">space-4</div><div class="px">16px</div><div class="bar" style="width: 16px;"></div><div class="note">card items</div></div>
  <div class="row"><div class="name">space-5</div><div class="px">20px</div><div class="bar" style="width: 20px;"></div><div class="note">page outer padding</div></div>
  <div class="row"><div class="name">space-6</div><div class="px">24px</div><div class="bar" style="width: 24px;"></div><div class="note">page sections · card padding</div></div>
  <div class="row"><div class="name">space-8</div><div class="px">32px</div><div class="bar" style="width: 32px;"></div><div class="note">large gaps</div></div>
</body>
</html>
