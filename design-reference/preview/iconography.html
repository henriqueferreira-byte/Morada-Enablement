<!doctype html>
<!-- @dsCard group="Brand" name="Iconography — Tabler" subtitle="@tabler/icons-react · stroke-based · 24px canvas" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Iconography — Tabler</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--card); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
  .item svg { color: var(--text-primary); }
  .nm-name { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); text-align: center; }
  .h { font-family: var(--font-heading); font-weight: 600; font-size: 13px; color: var(--text-primary); margin: 0 0 8px; }
  .sub { font-family: var(--font-body); font-size: 11px; color: var(--text-tertiary); margin: 0 0 10px; }
</style>
</head>
<body>
  <p class="h">@tabler/icons-react · stroke 2 · 24px canvas</p>
  <p class="sub">Lucide-style stroked icons. The Niemeyer ESLint plugin forbids other icon sets.</p>
  <div class="row">
    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span class="nm-name">home</span></div>

    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l4-4 4 4 8-8"/><path d="M14 6h6v6"/></svg><span class="nm-name">trending-up</span></div>

    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nm-name">clock-hour-4</span></div>

    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span class="nm-name">search</span></div>
    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg><span class="nm-name">plus</span></div>
    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><span class="nm-name">circle-check</span></div>
    <div class="item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l5 5 10-10"/><path d="M19 14v5H5v-5"/></svg><span class="nm-name">arrow-up-right</span></div>
  </div>
</body>
</html>
