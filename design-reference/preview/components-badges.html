<!doctype html>
<!-- @dsCard group="Components" name="Badges & pills" subtitle="Status badges with dot + label" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--card); display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>
<body>
  <div class="row">
    <span class="nm-badge nm-badge--success"><span class="nm-dot"></span> Fechado</span>
    <span class="nm-badge nm-badge--warning"><span class="nm-dot"></span> Negociando</span>
    <span class="nm-badge nm-badge--destructive"><span class="nm-dot"></span> Perdido</span>
    <span class="nm-badge nm-badge--info"><span class="nm-dot"></span> Novo lead</span>
    <span class="nm-badge nm-badge--primary"><span class="nm-dot"></span> MIA</span>
  </div>
  <div class="row">
    <span class="nm-badge">Marketing</span>
    <span class="nm-badge nm-badge--outline">DEMO MG</span>
    <span class="nm-badge nm-badge--outline">Residencial</span>
    <span class="nm-badge nm-badge--outline">+ 3 tags</span>
  </div>
  <div class="row">
    <span class="nm-badge nm-badge--success" style="font-size:11px; padding:2px 8px;">+12%</span>
    <span class="nm-badge nm-badge--destructive" style="font-size:11px; padding:2px 8px;">-4</span>
    <span class="nm-badge nm-badge--primary" style="font-size:11px; padding:2px 8px;">92%</span>
  </div>
</body>
</html>
