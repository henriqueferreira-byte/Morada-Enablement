<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="primary · secondary · outline · ghost · link · destructive" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../components.css" />
<style>
  body { margin: 0; padding: 18px 20px; background: var(--card); }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); text-align: right; }
</style>
</head>
<body>
<div class="grid">
  <div class="lbl">primary</div>
  <div class="row">
    <button class="nm-btn">Salvar campanha</button>
    <button class="nm-btn nm-btn--sm">Editar</button>
    <button class="nm-btn nm-btn--xs">+ Novo</button>
  </div>

  <div class="lbl">secondary · cya</div>
  <div class="row">
    <button class="nm-btn nm-btn--secondary">Filtros</button>
    <button class="nm-btn nm-btn--secondary nm-btn--sm">Aplicar</button>
  </div>

  <div class="lbl">outline · ghost</div>
  <div class="row">
    <button class="nm-btn nm-btn--outline">Cancelar</button>
    <button class="nm-btn nm-btn--ghost">Voltar</button>
    <button class="nm-btn nm-btn--link">Ver todas</button>
  </div>

  <div class="lbl">destructive</div>
  <div class="row">
    <button class="nm-btn nm-btn--destructive">Excluir fila</button>
    <button class="nm-btn nm-btn--destructive nm-btn--sm">Remover</button>
  </div>

  <div class="lbl">disabled</div>
  <div class="row">
    <button class="nm-btn" disabled>Salvar</button>
    <button class="nm-btn nm-btn--outline" disabled>Editar</button>
  </div>
</div>
</body>
</html>
