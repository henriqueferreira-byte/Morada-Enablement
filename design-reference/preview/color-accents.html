<!doctype html>
<!-- @dsCard group="Colors" name="Accent scales" subtitle="cyan · cya · orange · coral" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Color — Accent scales</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 16px; background: var(--card); font-family: var(--font-body); }
  .scale { display: grid; grid-template-columns: 80px repeat(10, 1fr); gap: 4px; align-items: center; margin-bottom: 8px; }
  .name { font-family: var(--font-heading); font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .sub  { font-family: var(--font-body); font-size: 10px; color: var(--text-tertiary); }
  .chip { height: 30px; border-radius: 6px; border: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="scale">
    <div><div class="name">cyan</div><div class="sub">#02CFFF</div></div>
    <div class="chip" style="background:#ECFDFF"></div><div class="chip" style="background:#D4F9FF"></div><div class="chip" style="background:#A8F0FF"></div><div class="chip" style="background:#6BE4FF"></div><div class="chip" style="background:#2FD6FF"></div><div class="chip" style="background:#02CFFF"></div><div class="chip" style="background:#00AEDB"></div><div class="chip" style="background:#008DB2"></div><div class="chip" style="background:#006D8A"></div><div class="chip" style="background:#004D63"></div>
  </div>
  <div class="scale">
    <div><div class="name">cya</div><div class="sub">#00FFE0</div></div>
    <div class="chip" style="background:#ebfffc"></div><div class="chip" style="background:#c5fff5"></div><div class="chip" style="background:#9cfde9"></div><div class="chip" style="background:#52fadb"></div><div class="chip" style="background:#19ffec"></div><div class="chip" style="background:#00ffe0"></div><div class="chip" style="background:#00ccb3"></div><div class="chip" style="background:#009987"></div><div class="chip" style="background:#006659"></div><div class="chip" style="background:#003d35"></div>
  </div>
  <div class="scale">
    <div><div class="name">orange</div><div class="sub">#F7B87D</div></div>
    <div class="chip" style="background:#fff5ec"></div><div class="chip" style="background:#ffe4cc"></div><div class="chip" style="background:#fccda0"></div><div class="chip" style="background:#fac085"></div><div class="chip" style="background:#f7b87d"></div><div class="chip" style="background:#f2a05c"></div><div class="chip" style="background:#e07c2a"></div><div class="chip" style="background:#c05e16"></div><div class="chip" style="background:#9a460d"></div><div class="chip" style="background:#6b2e07"></div>
  </div>
  <div class="scale">
    <div><div class="name">coral</div><div class="sub">#F27D82 · accent</div></div>
    <div class="chip" style="background:#fff1f1"></div><div class="chip" style="background:#ffd9da"></div><div class="chip" style="background:#fbb5b8"></div><div class="chip" style="background:#f79096"></div><div class="chip" style="background:#f27d82"></div><div class="chip" style="background:#e1565c"></div><div class="chip" style="background:#c43d44"></div><div class="chip" style="background:#9d2a30"></div><div class="chip" style="background:#751c22"></div><div class="chip" style="background:#4b1115"></div>
  </div>
</body>
</html>
