<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="xs · sm · md · lg · glass (home)" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px 20px; background: var(--background); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .swatch { width: 100%; aspect-ratio: 1.4/1; border-radius: var(--radius-xl); background: var(--card); border: 1px solid rgba(0,0,0,0.02); }
  .name { font-family: var(--font-heading); font-size: 12px; font-weight: 600; color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="swatch" style="box-shadow: var(--shadow-xs); border-color: var(--border);"></div><div class="name">xs · default card</div><div class="meta">0 1px 2px rgba(0,0,0,.03)</div></div>
    <div class="item"><div class="swatch" style="box-shadow: var(--shadow-sm);"></div><div class="name">sm · plain</div><div class="meta">0 1px 2px rgba(0,0,0,.05)</div></div>
    <div class="item"><div class="swatch" style="box-shadow: var(--shadow-md);"></div><div class="name">md · menu</div><div class="meta">0 4px 6px-1px</div></div>
    <div class="item"><div class="swatch" style="box-shadow: var(--shadow-lg);"></div><div class="name">lg · popover</div><div class="meta">0 10px 15px-3px</div></div>
    <div class="item"><div class="swatch" style="box-shadow: var(--shadow-glass); background: rgba(255,255,255,.75); backdrop-filter: blur(20px);"></div><div class="name">glass · home</div><div class="meta">0 8px 30px rgba(15,30,80,.08)</div></div>
  </div>
</body>
</html>
