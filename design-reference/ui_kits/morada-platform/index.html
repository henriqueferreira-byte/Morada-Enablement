<!doctype html>
<!-- @dsCard group="UI Kit — Morada Platform" name="Morada Platform — Home" subtitle="Interactive: sky-backed Home with MIA, KPIs, hi/lo, anúncios. Try the phase bar." viewport="1280x720" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Morada platform — Niemeyer UI kit</title>
<link rel="icon" href="../../assets/logos/favicon.png" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="morada-platform.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root" data-screen-label="Morada platform · Home"></div>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="TopBar.jsx"></script>
  <script type="text/babel" src="HeroChat.jsx"></script>
  <script type="text/babel" src="KpiCard.jsx"></script>
  <script type="text/babel" src="HiLoCard.jsx"></script>
  <script type="text/babel" src="AnnouncementCard.jsx"></script>
  <script type="text/babel" src="NotificationsCard.jsx"></script>
  <script type="text/babel" src="HomePage.jsx"></script>

  <script type="text/babel">
    function App() {
      const [active, setActive] = React.useState("home");
      const labels = {
        home: ["Home"], dashboard: ["Dashboard", "Visão geral"], talk: ["Talk", "Atendimentos"],
        leads: ["Negócios", "Pipeline"], marketing: ["Marketing", "Campanhas"], filas: ["Filas"],
        library: ["Biblioteca"], skills: ["Skills"],
      };
      return (
        <div className="mp-shell">
          <Sidebar active={active} onChange={setActive} />
          <div className="mp-content">
            <TopBar crumbs={labels[active]} />
            <main className="mp-main">
              {active === "home" ? <HomePage /> : <PlaceholderScreen which={active} />}
            </main>
          </div>
        </div>
      );
    }

    function PlaceholderScreen({ which }) {
      return (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", padding: 48, gap: 12, color: "var(--text-secondary)" }}>
          <div style={{ width: 56, height: 56, borderRadius: 14, background: "color-mix(in srgb, var(--primary) 12%, transparent)", color: "var(--primary)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <IconSparkles size={24} />
          </div>
          <h2 style={{ fontFamily: "var(--font-heading)", fontSize: 20, fontWeight: 700, color: "var(--text-primary)", margin: 0 }}>
            Tela "{which}" — referência apenas
          </h2>
          <p style={{ maxWidth: 520, textAlign: "center", lineHeight: 1.5, margin: 0 }}>
            Este UI kit foca na <strong>Home</strong> — a superfície assinatura da plataforma Morada.ai. Volte para
            <span style={{ color: "var(--primary)", fontWeight: 600 }}> Home </span>
            na barra lateral para ver a composição completa: céu por horário, MIA, KPIs, hi/lo, anúncios e notificações.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
